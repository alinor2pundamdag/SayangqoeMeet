name: Scheduled Chat Media Cleanup

on:
  schedule:
    # Runs every day at 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate cleanup secret and queue access without deleting media"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Invoke cleanup worker
        env:
          SUPABASE_URL: https://phjwzrrsaemgcedwpyyp.supabase.co
          CLEANUP_SECRET: ${{ secrets.MEDIA_CLEANUP_CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLEANUP_SECRET}" ]]; then
            echo "Required cleanup secret is not configured."
            exit 1
          fi

          payload='{}'
          if [[ "${DRY_RUN}" == "true" ]]; then
            payload='{"dry_run":true}'
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 120 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Content-Type: application/json" \
              --header "x-cleanup-secret: ${CLEANUP_SECRET}" \
              --data "$payload" \
              "${SUPABASE_URL}/functions/v1/cleanup-chat-media"
          )"

          if [[ "$status" != "200" ]]; then
            case "$status" in
              401)
                echo "Cleanup authentication failed (HTTP 401). Verify MEDIA_CLEANUP_CRON_SECRET exists in GitHub Actions and matches the Supabase Edge Function secret; never print either value."
                ;;
              404)
                echo "Cleanup endpoint returned HTTP 404. Verify the deployed function name and URL."
                ;;
              500)
                echo "Cleanup worker returned HTTP 500. Check Supabase function configuration, database RPCs, and function logs."
                ;;
              *)
                echo "Cleanup request failed with HTTP ${status}."
                ;;
            esac
            exit 1
          fi

          if [[ "${DRY_RUN}" == "true" ]]; then
            if ! jq -e 'type == "object" and .dry_run == true and (.queue_rows | type == "number") and .failed == 0' "$response_file" >/dev/null; then
              echo "Cleanup dry-run returned HTTP 200 but its response was invalid."
              exit 1
            fi
            echo "Cleanup dry-run succeeded; no media was deleted:"
            jq '{dry_run, queue_rows, claimed, purged, failed}' "$response_file"
            exit 0
          fi

          if ! jq -e 'type == "object" and (.claimed | type == "number") and (.purged | type == "number") and (.failed | type == "number") and .failed == 0' "$response_file" >/dev/null; then
            echo "Cleanup endpoint returned HTTP 200 but the response was invalid or one or more cleanup jobs failed."
            exit 1
          fi

          echo "Cleanup worker succeeded:"
          jq '{claimed, purged, failed}' "$response_file"

          call_response_file="$(mktemp)"
          trap 'rm -f "$response_file" "$call_response_file"' EXIT

          call_status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              --output "$call_response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Content-Type: application/json" \
              --header "x-cleanup-secret: ${CLEANUP_SECRET}" \
              --data "$payload" \
              "${SUPABASE_URL}/functions/v1/cleanup-stale-calls"
          )"

          if [[ "$call_status" != "200" ]]; then
            echo "Stale-call cleanup failed with HTTP ${call_status}; check function configuration and logs."
            exit 1
          fi

          if [[ "${DRY_RUN}" == "true" ]]; then
            if ! jq -e 'type == "object" and .dry_run == true and (.stale_ringing_calls | type == "number") and .marked_missed == 0' "$call_response_file" >/dev/null; then
              echo "Stale-call dry-run response was invalid."
              exit 1
            fi
            echo "Stale-call dry-run succeeded; no call state was changed:"
            jq '{dry_run, stale_ringing_calls, marked_missed}' "$call_response_file"
          else
            if ! jq -e 'type == "object" and .dry_run == false and (.stale_ringing_calls | type == "number") and (.marked_missed | type == "number") and .stale_ringing_calls == .marked_missed' "$call_response_file" >/dev/null; then
              echo "Stale-call cleanup response was invalid."
              exit 1
            fi
            echo "Stale-call cleanup succeeded:"
            jq '{dry_run, stale_ringing_calls, marked_missed}' "$call_response_file"
          fi
