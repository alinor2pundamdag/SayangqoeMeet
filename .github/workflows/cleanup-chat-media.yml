name: Scheduled Chat Media Cleanup

on:
  schedule:
    # Runs every day at 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Invoke cleanup worker
        env:
          SUPABASE_URL: https://phjwzrrsaemgcedwpyyp.supabase.co
          CLEANUP_SECRET: ${{ secrets.MEDIA_CLEANUP_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLEANUP_SECRET}" ]]; then
            echo "Required cleanup secret is not configured."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 120 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Content-Type: application/json" \
              --header "x-cleanup-secret: ${CLEANUP_SECRET}" \
              --data '{}' \
              "${SUPABASE_URL}/functions/v1/cleanup-chat-media"
          )"

          if [[ "$status" != "200" ]]; then
            case "$status" in
              401)
                echo "Cleanup authentication failed (HTTP 401). Verify MEDIA_CLEANUP_CRON_SECRET exists in GitHub Actions and matches the Supabase Edge Function secret; never print either value."
                ;;
              404)
                echo "Cleanup endpoint returned HTTP 404. Verify the deployed function name and URL."
                ;;
              500)
                echo "Cleanup worker returned HTTP 500. Check Supabase function configuration, database RPCs, and function logs."
                ;;
              *)
                echo "Cleanup request failed with HTTP ${status}."
                ;;
            esac
            exit 1
          fi

          if ! jq -e 'type == "object" and (.claimed | type == "number") and (.purged | type == "number") and (.failed | type == "number") and .failed == 0' "$response_file" >/dev/null; then
            echo "Cleanup endpoint returned HTTP 200 but the response was invalid or one or more cleanup jobs failed."
            exit 1
          fi

          echo "Cleanup worker succeeded:"
          jq '{claimed, purged, failed}' "$response_file"
