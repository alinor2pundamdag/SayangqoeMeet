name: Phase 2 Database Validation
# Keep the validation environment pinned; runner startup failures must not be mistaken for code failures.
# Always replay every timestamped migration and run the negative RLS suite before merge.
# A green result is valid only for the exact head SHA that was actually tested.

on:
  push:
    branches:
      - main
      - fix/phase-2-main-rebased
      - feat/messenger-inspired-media-call-ux
      - fix/final-readiness-uiux-audit
    paths:
      - "supabase/**"
      - ".github/workflows/phase2-database-validation.yml"
  pull_request:
    # Validate feature-to-feature and feature-to-main PRs alike; otherwise
    # the migration/RLS suite silently skips PRs whose base is not main.
    paths:
      - "supabase/**"
      - ".github/workflows/phase2-database-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-db-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fresh-migration-replay:
    name: Fresh Supabase migration replay and RLS isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check push Edge Functions
        run: find supabase/functions -name index.ts -print0 | xargs -0 deno check --no-lock

      - name: Test permanent FCM token error classification
        run: deno test supabase/functions/_shared/fcm-token-errors_test.ts

      - name: Test cleanup secret comparison
        run: deno test supabase/functions/_shared/constant-time-equals_test.ts

      - name: Test admin JWT assurance parsing
        run: deno test supabase/functions/_shared/jwt-assurance_test.ts

      - name: Test safe media cleanup object paths
        run: deno test supabase/functions/_shared/chat-media-path_test.ts

      - name: Validate admin console JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("admin-console/index.html", "utf8");
          const start = html.indexOf("<script>");
          const end = html.indexOf("</script>", start + 8);
          if (start < 0 || end < 0 || html.indexOf("<script>", start + 8) !== -1) {
            throw new Error("Expected exactly one inline admin-console script");
          }
          new Function(html.slice(start + 8, end));
          console.log("Admin console inline JavaScript syntax is valid.");
          NODE

      - name: Set up Supabase CLI
        id: setup-supabase-cli
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start disposable local Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit

      - name: Replay the complete migration chain from an empty database
        run: supabase db reset --local --debug

      - name: Run two-user authenticated message RLS isolation test
        run: |
          set -euo pipefail
          supabase db lint --local --fail-on error
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase2_two_user_rls.sql

      - name: Stop disposable local Supabase stack
        if: always() && steps.setup-supabase-cli.outcome == 'success'
        run: supabase stop --no-backup
