name: Phase 2 Database Validation

on:
  pull_request:
    branches:
      - fix/phase-1-auth-manifest-ci
    paths:
      - "supabase/**"
      - ".github/workflows/phase2-database-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-db-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fresh-migration-replay:
    name: Fresh Supabase migration replay and RLS isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check push Edge Functions
        run: deno check --no-lock supabase/functions/notify-incoming-call/index.ts supabase/functions/send-message-push/index.ts supabase/functions/get-turn-credentials/index.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable local Supabase stack
        run: supabase start -x studio,mailpit,edge-runtime,logflare,vector

      - name: Replay the complete migration chain from an empty database
        run: supabase db reset --local --debug

      - name: Run two-user authenticated message RLS isolation test
        run: |
          set -euo pipefail
          supabase db lint --local --fail-on error
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/phase2_two_user_rls.sql

      - name: Stop disposable local Supabase stack
        if: always()
        run: supabase stop --no-backup
