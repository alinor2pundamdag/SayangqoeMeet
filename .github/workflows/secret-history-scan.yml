name: Secret History Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: secret-history-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan full Git history and current files for exposed secrets
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        id: install-gitleaks
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan all reachable Git history (all refs, all parents)
        id: history-scan
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --log-opts="--all --full-history" \
            --redact \
            --verbose \
            --exit-code=2 \
            --report-format=sarif \
            --report-path="$RUNNER_TEMP/gitleaks-history.sarif"

      - name: Scan current checked-out files
        id: working-tree-scan
        if: always() && steps.install-gitleaks.outcome == 'success'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir . \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path="$RUNNER_TEMP/gitleaks-working-tree.sarif"

      - name: Preserve redacted scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif-reports
          path: |
            ${{ runner.temp }}/gitleaks-history.sarif
            ${{ runner.temp }}/gitleaks-working-tree.sarif
          if-no-files-found: warn
          retention-days: 14
