name: Android CI

on:
  push:
    branches:
      - main
      - fix/phase-2-main-rebased
      - fix/phase-2-db-reconciliation-on-phase-1
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same branch to conserve Actions minutes.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Avoid the deprecated "tools" package, which sdkmanager no longer provides.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run lint, unit tests, and assemble debug APK
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: Name APK after project
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SayangqoeMeet.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SayangqoeMeet-Android-APK
          path: app/build/outputs/apk/debug/SayangqoeMeet.apk
          if-no-files-found: error
          retention-days: 7
